name: Tests
# The browser scenario suite (tests/scenarios) on every pull request: the page against the committed golden traces (also the old script behind ?legacy),
# the moved legacy script against the inline script it came from, and the import map stamp.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scenarios:
    # the goldens were recorded on Ubuntu 24.04 with DejaVu Sans and IPAGothic; card sizes (and so the physics) come from text wrapping
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-legacy-move reads index.html at commit 41683e8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium and its system packages
        run: npx playwright install --with-deps chromium
      - name: Fonts the harness pins
        run: sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-ipafont-gothic
      - name: scripts/legacy.js is the old inline script, byte for byte (until it is deleted)
        if: ${{ hashFiles('scripts/legacy.js') != '' }}
        run: npm run check:legacy
      - name: Layers (what may import what; no timers or window.__ outside core)
        run: node scripts/lint-layers.mjs
      - name: Import map is current
        run: npm run stamp:check
      - name: Unit tests
        run: node --test tests/unit/*.test.js
      - name: Scenarios (the modules under src/, against tests/golden)
        run: npm test
      - name: Scenarios on /?legacy (the old script, until it is deleted)
        if: ${{ hashFiles('scripts/legacy.js') != '' }}
        run: npm run test:legacy
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shots
          path: tests/shots/
          if-no-files-found: ignore
