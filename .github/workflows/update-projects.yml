name: Update kiripad.dev project list
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: [scripts/update.mjs, .github/workflows/update-projects.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
        env:
          KIRIPAD_TOKEN: ${{ secrets.KIRIPAD_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          git diff --quiet projects.json && exit 0
          git config user.name "kiripad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update project list"
          git push
